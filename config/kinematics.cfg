[printer]
kinematics: cartesian

# =================================================
# GLOBAL SAFETY LIMITS (never normally reached)
# =================================================

# Absolute XY ceiling
# PUSH mode tops out at 280 mm/s, so this is a true hard limit
max_velocity: 300

# Absolute acceleration ceiling
# PUSH uses 4500, this leaves margin without enabling abuse
max_accel: 5000

# Prevent ultra-short accel ramps on tiny segments
# Improves smoothness and noise behavior
minimum_cruise_ratio: 0.5

# Conservative startup SCV
# All motion modes explicitly override this
square_corner_velocity: 5.0


# =================================================
# Z AXIS (HEAVY BED, Z-ONLY MOTION)
# =================================================

# Slow and deliberate by design
# Bed inertia + safety > speed
max_z_velocity: 5

# Extremely gentle Z acceleration
# Prevents thumps, ringing, and mechanical stress
max_z_accel: 20
