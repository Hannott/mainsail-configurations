[printer]
kinematics: cartesian

# -------------------------------------------------
# Global XY motion safety limits
# -------------------------------------------------
max_velocity: 300
max_accel: 5000
minimum_cruise_ratio: 0.5
square_corner_velocity: 5.0

# -------------------------------------------------
# Z-specific limits (heavy moving bed)
# Z+ = bed UP, Z- = bed DOWN
# -------------------------------------------------
max_z_velocity: 5
max_z_accel: 20
