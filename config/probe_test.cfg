[gcode_macro PROBE_TEST]
description: Deploy probe, test trigger, retract, without requiring XY homing
gcode:
  M118 PROBE TEST STARTING...

  # -------------------------------------------------------
  # Ensure Z is homed (bed must be down at safe known point)
  # -------------------------------------------------------
  #{% if not printer.toolhead.homed_axes.z %}
   #   M118 Z not homed — homing Z now...
    #  G28 Z
  #{% endif %}

  # Deploy probe
  M118 Deploying probe...
  PROBE_DEPLOY
  G4 P300

  # Check idle state BEFORE contact
  M118 Checking idle trigger state...
  QUERY_PROBE
  {% if printer.probe.last_query == "TRIGGERED" %}
      M118 ERROR: Probe shows TRIGGERED before touching bed!
      PROBE_STOW
      M118 PROBE TEST FAILED
      CANCEL
  {% endif %}

  # Move bed UP (Z+) toward fixed nozzle to cause contact
  M118 Moving bed UP to trigger probe...
  G91
  G1 Z4 F300
  G90

  # Check trigger state AFTER contact
  M118 Checking trigger response...
  QUERY_PROBE
  {% if printer.probe.last_query == "open" %}
      M118 ERROR: Probe did NOT trigger when expected!
      M118 Check probe actuation and wiring.
      PROBE_STOW
      M118 PROBE TEST FAILED
      CANCEL
  {% endif %}

  # Retract probe
  M118 Retracting probe...
  PROBE_STOW
  G4 P300

  # Lower bed DOWN for clearance
  M118 Lowering bed for clearance...
  G91
  G1 Z-6 F600
  G90

  M118 PROBE TEST PASSED
