[bed_mesh]
speed: 120
horizontal_move_z: 5

# Mesh area — safe usable region
# Based on Guider 2S build plate reachable probe area
mesh_min: 10,10
mesh_max: 270,240

# Probe grid density
# 7 points in X, 5 in Y (higher resolution for large bed)
probe_count: 7,5

# Algorithm:
# bicubic gives smoother surface transitions for large flatbeds
algorithm: bicubic

# Fade controls how quickly the mesh is blended out
fade_start: 1.0
fade_end: 10.0
fade_target: 0.0

# For MicroProbe V2, we keep retracts small and consistent
move_check_distance: 3.0
split_delta_z: .025

# Adaptive probing disabled until probe-to-bed repeatability is confirmed
adaptive_margin: 0
