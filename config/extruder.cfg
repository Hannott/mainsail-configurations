# =================================================
# EXTRUDER CONFIGURATION
# =================================================

[extruder]
step_pin: E_STEP
dir_pin: E_DIR
enable_pin: E_EN

microsteps: 16
rotation_distance: 32.0   # ⚠️ TEMPORARY – must be calibrated
nozzle_diameter: 0.4
filament_diameter: 1.75

heater_pin: E_HEATER
sensor_pin: E_SENSOR
sensor_type: PT1000

control: watermark
min_temp: 0
max_temp: 300


# =================================================
# FIRMWARE RETRACTION
# =================================================
# Used by G10 (retract) and G11 (unretract)
# Values are startup defaults and can be tuned later
# via SET_RETRACTION or per-slicer / per-filament
# =================================================

[firmware_retraction]
retract_length: 0.8
retract_speed: 25
unretract_extra_length: 0
unretract_speed: 15
