# =================================================
# HOMING OVERRIDE
# =================================================
# Moving-bed Z axis
# Z+ = bed UP    (away from sensor)
# Z- = bed DOWN  (toward sensor)
# =================================================

[homing_override]
axes: xyz
set_position_z: 0
gcode:

  # -----------------
  # X AXIS (MIN)
  # -----------------
  G91
  {% if printer.endstops.x %}
    G1 X5 F6000          ; move away from sensor
  {% endif %}
  G28 X                  ; fast homing toward sensor
  G1 X5 F4000            ; clear sensor
  G1 X-5 F600            ; slow precision re-trigger
  G90

  # -----------------
  # Y AXIS (MIN)
  # -----------------
  G91
  {% if printer.endstops.y %}
    G1 Y5 F6000          ; move away from sensor
  {% endif %}
  G28 Y                  ; fast homing toward sensor
  G1 Y5 F4000            ; clear sensor
  G1 Y-5 F600            ; slow precision re-trigger
  G90

  # -----------------
  # Z AXIS (MIN, moving bed)
  # SAFE (STALL-PROTECTED)
  # -----------------
  SAFE_HOME_Z
