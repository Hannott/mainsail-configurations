# =================================================
# PRINT PAUSE / RESUME
# =================================================

[gcode_macro PAUSE]
rename_existing: PAUSE_BASE
gcode:
  {% if printer.print_stats.state != "printing" %}
    PAUSE_BASE
    RETURN
  {% endif %}

  SAVE_GCODE_STATE NAME=PAUSE_STATE
  G91

  # Wipe move while retracting (firmware retraction)
  G10
  G1 X5 F3000

  # Increase nozzle-to-print clearance
  # Z- = bed moves DOWN
  G1 Z-8 F1200

  G90
  G1 X0 Y200 F6000

  PAUSE_BASE
  RUN_SHELL_COMMAND CMD=play_print_paused


[gcode_macro RESUME]
rename_existing: RESUME_BASE
gcode:
  RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1

  # Restore extrusion (firmware unretraction)
  G11

  RUN_SHELL_COMMAND CMD=play_print_resumed
  RESUME_BASE


# =================================================
# PRINT CANCEL (wipe, safe homing, audio)
# =================================================

[gcode_macro CANCEL_PRINT]
rename_existing: CANCEL_PRINT_BASE
gcode:
  {% if printer.print_stats.state == "printing" %}
    SAVE_GCODE_STATE NAME=CANCEL_STATE
    G91

    # Wipe move while retracting
    G10
    G1 X5 F3000

    # Increase clearance
    # Z- = bed moves DOWN
    G1 Z-8 F1200

    G90
  {% endif %}

  # Home safely: Z first, then X/Y
  G28 Z
  G28 X Y

  RUN_SHELL_COMMAND CMD=play_print_cancelled
  CANCEL_PRINT_BASE


# =================================================
# COOLDOWN HELPER
# =================================================

[gcode_macro WAIT_FOR_COOLDOWN]
description: Wait until hotend cools below safe temp and announce
gcode:
  TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=50
  RUN_SHELL_COMMAND CMD=play_cooldown_complete


# =================================================
# PRINT END SEQUENCE (wipe, safe homing, audio)
# =================================================

[gcode_macro PRINT_END]
description: Standard print shutdown sequence with wipe and safe homing
gcode:
  # Ensure all queued moves complete
  M400

  SAVE_GCODE_STATE NAME=END_STATE
  G91

  # Wipe move while retracting
  G10
  G1 X5 F3000

  # Increase clearance
  # Z- = bed moves DOWN
  G1 Z-8 F1200

  G90

  # Turn off heaters
  TURN_OFF_HEATERS

  # Home safely: Z first, then X/Y
  G28 Z
  G28 X Y

  # Disable motors
  M84

  # Audio notification: print complete
  RUN_SHELL_COMMAND CMD=play_print_complete

  # Wait for cooldown and announce
  WAIT_FOR_COOLDOWN
