# =================================================
# DYNAMIC INPUT SHAPER — MODE-BASED SHAPER PROFILES
# =================================================

[input_shaper]


[gcode_macro _APPLY_SHAPER_MODE_0]
description: Silent mode shaping (maximum stability)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=54.8 SHAPER_TYPE_Y=ei SHAPER_FREQ_Y=55.6


[gcode_macro _APPLY_SHAPER_MODE_1]
description: Standard mode shaping (stable, smooth)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=54.6 SHAPER_TYPE_Y=2hump_ei SHAPER_FREQ_Y=59.2 ##


[gcode_macro _APPLY_SHAPER_MODE_2]
description: Fast mode shaping (balance speed vs stability)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=54.6 SHAPER_TYPE_Y=ei SHAPER_FREQ_Y=59.2 ##


[gcode_macro _APPLY_SHAPER_MODE_3]
description: Rush mode shaping (high-speed tuned)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=54.6 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=59.2 ##


[gcode_macro _APPLY_SHAPER_MODE_4]
description: Overdrive shaping (aggressive profile)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=54.6 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=59.2 ##


[gcode_macro _APPLY_SHAPER_MODE_5]
description: Extreme mode shaping (minimal latency)
gcode:
  SET_INPUT_SHAPER SHAPER_TYPE_X=mzv SHAPER_FREQ_X=53.4 SHAPER_TYPE_Y=mzv SHAPER_FREQ_Y=58.2

