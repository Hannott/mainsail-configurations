# =================================================
# SAFE Z HOMING (moving-bed Z axis)
#
# Z+ = bed UP    (away from endstop)
# Z- = bed DOWN  (toward endstop)
#
# Optical endstop remains positional authority.
# Stall detection acts only as an emergency brake.
# =================================================

[gcode_macro SAFE_HOME_Z]
description: Safe multi-stage Z homing with stall protection
gcode:
  {% if printer.print_stats.state != "standby" %}
    RESPOND TYPE=error MSG="Z homing blocked: printer not idle"
    RETURN
  {% endif %}

  # ----------------------------------------------
  # Arm Z stall protection
  # ----------------------------------------------
  _Z_STALL_ARM

  G91

  # ----------------------------------------------
  # 1. Clear endstop if already triggered
  # ----------------------------------------------
  {% if printer.endstops.z %}
    G1 Z5 F600          ; move bed UP to clear sensor
  {% endif %}

  # ----------------------------------------------
  # 2. Fast approach toward optical endstop
  # ----------------------------------------------
  G28 Z                 ; uses stepper_z homing_speed

  # ----------------------------------------------
  # 3. Retract away from endstop
  # ----------------------------------------------
  G1 Z5 F600             ; clear sensor hysteresis

  # ----------------------------------------------
  # 4. Slow precision re-trigger
  # ----------------------------------------------
  G1 Z-5 F120            ; controlled, accurate approach

  G90

  # ----------------------------------------------
  # Disarm stall protection
  # ----------------------------------------------
  _Z_STALL_DISARM
