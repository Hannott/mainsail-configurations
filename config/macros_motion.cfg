[gcode_macro _MOTION_STATE]
variable_mode: 0
gcode:
  # State holder only – do not call


[gcode_macro _BUTTON_STATE]
variable_pressed: 0
gcode:
  # Internal state only


# =================================================
# Persistence helpers
# =================================================

[gcode_macro FORCE_HOMED]
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0 SET_HOMED=XYZ
  G91


[gcode_macro TEST_XY_SHORT]
gcode:
  G90
  {% set runs = params.RUNS|default(1)|int %}
  {% for i in range(runs) %}
    G1 y30 x30 F24000
    G1 y0 x0 F24000
  {% endfor %}


[gcode_macro TEST_XY_LONG]
gcode:
  G90
  {% set runs = params.RUNS|default(1)|int %}
  {% for i in range(runs) %}
    G1 y250 x280 F24000
    G1 y0 x0 F24000
  {% endfor %}
  

[gcode_macro TEST_Y_LONG]
gcode:
  G90
  {% set runs = params.RUNS|default(1)|int %}
  {% for i in range(runs) %}
    G1 y250 F24000
    G1 y0 F24000
  {% endfor %}
  

[gcode_macro TEST_X_LONG]
gcode:
  G90
  {% set runs = params.RUNS|default(1)|int %}
  {% for i in range(runs) %}
    G1 x280 F24000
    G1 x0 F24000
  {% endfor %}
  

[gcode_macro WILD_TEST]
gcode:
  G90
  G21
  G92 X0 Y0

  ; Warmup perimeter
  G1 X280 Y0 F15000
  G1 X280 Y250
  G1 X0 Y250
  G1 X0 Y0

  ; Sweeping S-curves
  G1 X0 Y125 F24000
  G1 X280 Y180
  G1 X0 Y70
  G1 X280 Y200
  G1 X0 Y40
  G1 X280 Y225

  ; Safe arc block A
  G1 X140 Y125
  G2 X170 Y145 I15 J10
  G3 X140 Y125 I-15 J-10

  ; Diagonal criss-cross
  G1 X10 Y10
  G1 X270 Y240
  G1 X30 Y20
  G1 X250 Y230

  ; Safe arc block B
  G1 X120 Y140
  G3 X150 Y160 I15 J10
  G2 X120 Y140 I-15 J-10

  ; Random hops
  G1 X60 Y40
  G1 X220 Y210
  G1 X235 Y145
  G1 X45 Y210
  G1 X260 Y35
  G1 X15 Y180

  ; Safe arc block C
  G1 X160 Y100
  G2 X180 Y120 I10 J10
  G3 X160 Y100 I-10 J-10

  ; Polygon sweep
  G1 X180 Y20
  G1 X90 Y240
  G1 X270 Y125
  G1 X20 Y60
  G1 X140 Y125
  G1 X200 Y185
  G1 X240 Y140
  G1 X230 Y90
  G1 X140 Y40
  G1 X70 Y80
  G1 X40 Y120
  G1 X60 Y180
  G1 X120 Y215
  G1 X180 Y200
  G1 X230 Y150
  G1 X140 Y125

  ; Tight oscillation
  G91
  G1 X20 Y-12
  G1 X-30 Y25
  G1 X28 Y-18
  G1 X-18 Y30
  G1 X16 Y-20
  G1 X-25 Y12
  G1 X32 Y-4
  G1 X-12 Y22
  G1 X10 Y-18
  G90

  ; Wide sweeps
  G1 X280 Y0
  G1 X0 Y250
  G1 X280 Y250
  G1 X0 Y0

  ; Move to circle start point on perimeter
  G1 X240 Y125

  ; ============================================================
  ; BIG CW CIRCLE #1 (two half-circles)
  ; ============================================================
  G2 X40 Y125 I-100 J0
  G2 X240 Y125 I100 J0

  ; BIG CCW CIRCLE #3
  G3 X40 Y125 I-100 J0
  G3 X240 Y125 I100 J0

  ; Return home
  G1 X0 Y0

  M400


[gcode_macro _SAVE_MOTION_MODE]
gcode:
  SAVE_VARIABLE VARIABLE=saved_motion_mode VALUE={printer["gcode_macro _MOTION_STATE"].mode}


[gcode_macro RESTORE_MOTION_MODE]
description: Restore last saved motion mode (fallback to STANDARD)
gcode:
  {% set m = printer.save_variables.variables.saved_motion_mode
               | default(1)
               | int %}

  {% if m == 0 %}
    SET_MODE_0
  {% elif m == 1 %}
    SET_MODE_1
  {% elif m == 2 %}
    SET_MODE_2
  {% elif m == 3 %}
    SET_MODE_3
  {% elif m == 4 %}
    SET_MODE_4
  {% elif m == 5 %}
    SET_MODE_5
  {% else %}
    SET_MODE_1
  {% endif %}


# =================================================
# MODE 0 — SILENT
# =================================================

[gcode_macro SET_MODE_0]
description: Silent mode
gcode:
  {% if printer.print_stats.state == "standby" %}
    RUN_SHELL_COMMAND CMD=play_mode_silent
    SET_VELOCITY_LIMIT VELOCITY=60 ACCEL=1000 SQUARE_CORNER_VELOCITY=3
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=0
    _SET_STEALTHCHOP
    _SAVE_MOTION_MODE
    _SET_MOTION_STATUS
    _APPLY_SHAPER_MODE_0
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# MODE 1 — STANDARD
# =================================================

[gcode_macro SET_MODE_1]
description: Standard mode
gcode:
  {% if printer.print_stats.state == "standby" %}
    RUN_SHELL_COMMAND CMD=play_mode_standard
    SET_VELOCITY_LIMIT VELOCITY=125 ACCEL=2000 SQUARE_CORNER_VELOCITY=4
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=1
    _SET_STEALTHCHOP
    _SAVE_MOTION_MODE
    _SET_MOTION_STATUS
    _APPLY_SHAPER_MODE_1
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


