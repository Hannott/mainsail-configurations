# =================================================
# MODE CYCLING (UI / BUTTON)
# =================================================

[gcode_macro TOGGLE_MOTION_MODE]
description: Cycle motion modes
gcode:
  {% if printer.print_stats.state == "standby" %}
    {% set m = printer["gcode_macro _MOTION_STATE"].mode %}
    {% if m == 0 %}
      SET_MODE_1
    {% elif m == 1 %}
      SET_MODE_2
    {% elif m == 2 %}
      SET_MODE_3
    {% elif m == 3 %}
      SET_MODE_4
    {% elif m == 4 %}
      SET_MODE_5
    {% elif m == 5 %}
      SET_MODE_0
    {% else %}
      SET_MODE_1
    {% endif %}
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# SET STEALTHCHOP
# =================================================

[gcode_macro _SET_STEALTHCHOP]
description: Force TMC2209 X/Y steppers into StealthChop
gcode:
  SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
  SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0


# =================================================
# SET SPREADCYCLE
# =================================================

[gcode_macro _SET_SPREADCYCLE]
description: Force TMC2209 X/Y steppers into SpreadCycle
gcode:
  SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1
  SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1


# =================================================
# UI STATUS
# =================================================

[gcode_macro _SET_MOTION_STATUS]
description: Update Mainsail motion status
gcode:
  {% set m = printer["gcode_macro _MOTION_STATE"].mode %}

  {% if m == 0 %}
    {% set mode_name %}SILENT{% endset %}
  {% elif m == 1 %}
    {% set mode_name %}STANDARD{% endset %}
  {% elif m == 2 %}
    {% set mode_name %}FAST{% endset %}
  {% elif m == 3 %}
    {% set mode_name %}RUSH{% endset %}
  {% elif m == 4 %}
    {% set mode_name %}OVERDRIVE SC{% endset %}
  {% elif m == 5 %}
    {% set mode_name %}EXTREME SC{% endset %}
  {% else %}
    {% set mode_name %}UNKNOWN{% endset %}
  {% endif %}

  {% set v = printer.toolhead.max_velocity|int %}
  {% set a = printer.toolhead.max_accel|int %}

  {% if printer.print_stats.state != "standby" %}
    {% set lock = " (LOCKED)" %}
  {% else %}
    {% set lock = "" %}
  {% endif %}

  {% set msg = "Mode: " ~ mode_name ~ " - " ~ v ~ " mm/s - " ~ a ~ " mm/s²" ~ lock %}
  SET_DISPLAY_TEXT MSG="{msg}"


[delayed_gcode _MOTION_BUTTON_LONG_PRESS]
gcode:
  {% if printer["gcode_macro _BUTTON_STATE"].pressed == 1 %}
    SET_GCODE_VARIABLE MACRO=_BUTTON_STATE VARIABLE=pressed VALUE=0
    SET_MODE_0
  {% endif %}
