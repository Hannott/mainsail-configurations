# =================================================
# Motion modes
#
# 0 = SILENT      (StealthChop, night-safe)
# 1 = QUIET_FAST  (StealthChop, daily driver)
# 2 = PERFORMANCE (StealthChop, tuned)
# 3 = PUSH        (SpreadCycle, exploration)
# =================================================

[gcode_macro _MOTION_STATE]
variable_mode: 0
gcode:
  # State holder only – do not call


[gcode_macro _BUTTON_STATE]
variable_pressed: 0
gcode:
  # internal state only


# =================================================
# MODE 0 — SILENT / NIGHT-SAFE
# =================================================

[gcode_macro SET_SILENT_MODE]
description: Silent baseline mode (night-safe, lowest noise)
gcode:
  {% if printer.print_stats.state == "standby" %}
    SET_VELOCITY_LIMIT VELOCITY=70 ACCEL=1000 SQUARE_CORNER_VELOCITY=4
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=0
    _SET_MOTION_STATUS
    RUN_SHELL_COMMAND CMD=play_mode_silent
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# MODE 1 — QUIET FAST (DAILY)
# =================================================

[gcode_macro SET_QUIET_FAST_MODE]
description: Quiet fast mode (daily driver)
gcode:
  {% if printer.print_stats.state == "standby" %}
    SET_VELOCITY_LIMIT VELOCITY=130 ACCEL=2200 SQUARE_CORNER_VELOCITY=6
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=1
    _SET_MOTION_STATUS
    RUN_SHELL_COMMAND CMD=play_mode_quiet_fast
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# MODE 2 — PERFORMANCE / TUNED
# =================================================

[gcode_macro SET_PERFORMANCE_MODE]
description: Performance mode (tuned, post input-shaping)
gcode:
  {% if printer.print_stats.state == "standby" %}
    SET_VELOCITY_LIMIT VELOCITY=200 ACCEL=3200 SQUARE_CORNER_VELOCITY=8
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=0
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=2
    _SET_MOTION_STATUS
    RUN_SHELL_COMMAND CMD=play_mode_performance
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# MODE 3 — PUSH / EXPERIMENTAL
# =================================================

[gcode_macro SET_PUSH_MODE]
description: Push mode (SpreadCycle, explore limits)
gcode:
  {% if printer.print_stats.state == "standby" %}
    SET_VELOCITY_LIMIT VELOCITY=280 ACCEL=4500 SQUARE_CORNER_VELOCITY=9
    SET_TMC_FIELD STEPPER=stepper_x FIELD=en_spreadcycle VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=en_spreadcycle VALUE=1
    SET_GCODE_VARIABLE MACRO=_MOTION_STATE VARIABLE=mode VALUE=3
    _SET_MOTION_STATUS
    RUN_SHELL_COMMAND CMD=play_mode_push
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


# =================================================
# MODE CYCLING (BUTTON / UI)
# =================================================

[gcode_macro TOGGLE_MOTION_MODE]
description: Cycle motion modes (silent → quiet_fast → performance → push)
gcode:
  {% if printer.print_stats.state == "standby" %}
    {% set m = printer["gcode_macro _MOTION_STATE"].mode %}
    {% if m == 0 %}
      SET_QUIET_FAST_MODE
    {% elif m == 1 %}
      SET_PERFORMANCE_MODE
    {% elif m == 2 %}
      SET_PUSH_MODE
    {% else %}
      SET_SILENT_MODE
    {% endif %}
  {% else %}
    RUN_SHELL_COMMAND CMD=play_mode_locked
  {% endif %}


[gcode_macro _SET_MOTION_STATUS]
description: Update Mainsail motion status with mode, limits, and lock state
gcode:
  {% set m = printer["gcode_macro _MOTION_STATE"].mode %}

  {% if m == 0 %}
    {% set mode_name %}
      <span style="color:#9CA3AF">SILENT</span>
    {% endset %}
  {% elif m == 1 %}
    {% set mode_name %}
      <span style="color:#3B82F6">QUIET FAST</span>
    {% endset %}
  {% elif m == 2 %}
    {% set mode_name %}
      <span style="color:#F59E0B">PERFORMANCE</span>
    {% endset %}
  {% elif m == 3 %}
    {% set mode_name %}
      <span style="color:#EF4444">PUSH</span>
    {% endset %}
  {% else %}
    {% set mode_name %}UNKNOWN{% endset %}
  {% endif %}

  {% set v = printer.toolhead.max_velocity|int %}
  {% set a = printer.toolhead.max_accel|int %}

  {% if printer.print_stats.state != "standby" %}
    {% set lock = " (LOCKED)" %}
  {% else %}
    {% set lock = "" %}
  {% endif %}

  {% set msg = "Motion " ~ mode_name ~ " - " ~ v ~ " mm/s - " ~ a ~ " mm/s²" ~ lock %}

  SET_DISPLAY_TEXT MSG="{msg}"


[delayed_gcode _MOTION_BUTTON_LONG_PRESS]
gcode:
  {% if printer["gcode_macro _BUTTON_STATE"].pressed == 1 %}
    SET_GCODE_VARIABLE MACRO=_BUTTON_STATE VARIABLE=pressed VALUE=0
    SET_SILENT_MODE
  {% endif %}
