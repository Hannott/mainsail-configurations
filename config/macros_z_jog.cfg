# =================================================
# SAFE Z JOG MACROS
#
# Z-only jogging for a moving-bed Z axis
# Z+ = bed UP    (away from nozzle)
# Z- = bed DOWN  (toward nozzle)
#
# Uses stall detection as an emergency brake.
# =================================================


[gcode_macro _Z_JOG_PARAMS]
description: Internal Z jog parameters
variable_step_mm: 2.0
variable_feedrate: 300
gcode:
  # parameter holder only


[gcode_macro _Z_JOG]
description: Internal helper for safe Z jogging
gcode:
  {% set dz = params.DZ|default(0)|float %}

  {% if dz == 0 %}
    RESPOND TYPE=error MSG="Z_JOG called with no movement"
    RETURN
  {% endif %}

  # Arm stall protection
  _Z_STALL_ARM

  G91
  G1 Z{dz} F{printer["gcode_macro _Z_JOG_PARAMS"].feedrate}
  G90

  # Disarm stall protection
  _Z_STALL_DISARM


[gcode_macro JOG_Z_UP]
description: Jog Z up (bed up)
gcode:
  _Z_JOG DZ={printer["gcode_macro _Z_JOG_PARAMS"].step_mm}


[gcode_macro JOG_Z_DOWN]
description: Jog Z down (bed down)
gcode:
  _Z_JOG DZ={-printer["gcode_macro _Z_JOG_PARAMS"].step_mm}
