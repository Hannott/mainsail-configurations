# =================================================
# Z STALL PROTECTION — Z-ONLY MOVING BED
# =================================================


[gcode_macro _Z_STALL_PARAMS]
variable_relief_mm: 5
variable_safe_current: 0.45
gcode:
  # parameter holder only


[gcode_macro _Z_STALL_ARM]
variable_armed: 0
gcode:
  # state holder only


[gcode_macro _Z_STALL_ABORT]
description: Handle Z stall safely (relief + pause)
gcode:
  M400

  G91
  G1 Z{printer["gcode_macro _Z_STALL_PARAMS"].relief_mm} F300
  G90

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.9 HOLD=0.6
  SET_GCODE_VARIABLE MACRO=_Z_STALL_ARM VARIABLE=armed VALUE=0

  RUN_SHELL_COMMAND CMD=play_z_obstruction
  PAUSE


[delayed_gcode _Z_STALL_WATCHDOG]
gcode:
  {% if printer["gcode_macro _Z_STALL_ARM"].armed == 1 %}
    {% if printer["gcode_button Z_STALL"].state == "PRESSED" %}
      _Z_STALL_ABORT
      RETURN
    {% endif %}
    UPDATE_DELAYED_GCODE ID=_Z_STALL_WATCHDOG DURATION=0.05
  {% endif %}
