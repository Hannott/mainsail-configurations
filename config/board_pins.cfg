[board_pins]

# -------------------------------------------------
# X AXIS (Driver0)
# -------------------------------------------------
aliases: X_STEP=PF13
aliases: X_DIR=PF12
aliases: X_EN=PF14
aliases: X_UART=PC4
aliases: X_ENDSTOP=PG6
aliases: X_DIAG=PG6

# -------------------------------------------------
# Y AXIS (Driver1)
# -------------------------------------------------
aliases: Y_STEP=PG0
aliases: Y_DIR=PG1
aliases: Y_EN=PF15
aliases: Y_UART=PD11
aliases: Y_ENDSTOP=PG9
aliases: Y_DIAG=PG9

# -------------------------------------------------
# Z AXIS (Driver2 – moving bed)
# -------------------------------------------------
aliases: Z_STEP=PF11
aliases: Z_DIR=PG3
aliases: Z_EN=PG5
aliases: Z_UART=PC6
aliases: Z_ENDSTOP=PG10
aliases: Z_DIAG=PG10

# -------------------------------------------------
# EXTRUDER (Driver4)
# -------------------------------------------------
aliases: E_STEP=PF9
aliases: E_DIR=PF10
aliases: E_EN=PG2
aliases: E_UART=PF2

# -------------------------------------------------
# HEATERS & SENSORS
# -------------------------------------------------
aliases: E_HEATER=PA2
aliases: E_SENSOR=PF4
aliases: BED_HEATER=PA1
aliases: BED_SENSOR=PF3

# -------------------------------------------------
# FANS
# -------------------------------------------------
aliases: HOTEND_FAN=PA8
aliases: PART_FAN=PE5

# -------------------------------------------------
# PROBE / MISC INPUTS
# -------------------------------------------------
aliases: PROBE_PIN=PB7
aliases: FILAMENT_RUNOUT=PG12
aliases: MOTION_MODE_BUTTON=PG13
