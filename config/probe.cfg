# =================================================
# BIQU MICROPROBE V2 — OCTOPUS PRO F446
# Wiring:
#   PB6 → probe_enable (OUTPUT)
#   PB7 → probe trigger (INPUT)
#   5V  → VCC
#   GND → GND (two GND pins are used as per BIQU diagram)
# =================================================

[output_pin probe_enable]
pin: PB6
value: 0
shutdown_value: 0
# The MicroProbe energizes when probe_enable=1.
# Always force it to 0 on shutdown for safety.


# -------------------------------------------------
# Deploy and stow macros
# -------------------------------------------------

[gcode_macro Probe_Deploy]
description: Energize MicroProbe before probing
gcode:
    SET_PIN PIN=probe_enable VALUE=1
    G4 P500     # allow 500ms for full mechanical deployment


[gcode_macro Probe_Stow]
description: De-energize MicroProbe after probing
gcode:
    SET_PIN PIN=probe_enable VALUE=0


# -------------------------------------------------
# Probe definition
# -------------------------------------------------

[probe]
pin: ^!PB7
# ^ = enable pullup resistor
# ! = invert logic (MicroProbe V2 pulls low when triggered)

deactivate_on_each_sample: False

# Offsets MUST be calibrated later using PROBE_CALIBRATE
x_offset: 0.0
y_offset: 0.0
z_offset: 0.0

# Probe motion tuning
speed: 5
lift_speed: 8
samples: 3
sample_retract_dist: 2.0

activate_gcode:
    Probe_Deploy

deactivate_gcode:
    Probe_Stow
