[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: !Z_EN

microsteps: 16
rotation_distance: 4

endstop_pin: Z_ENDSTOP
position_endstop: 300
position_min: 0
position_max: 300

homing_speed: 5
second_homing_speed: 3
homing_retract_dist: 3
