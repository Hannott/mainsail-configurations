[stepper_z]
step_pin: Z_STEP
dir_pin: Z_DIR
enable_pin: Z_EN

microsteps: 16
rotation_distance: 4   # TR8×4 confirmed

endstop_pin: Z_ENDSTOP
position_endstop: 0
position_min: 0
position_max: 300


# =================================================
# Z HOMING (FAST APPROACH, SLOW CONFIRM)
# =================================================

# First homing pass: long travel, no precision needed
# Significantly faster than before, still gentle for a heavy bed
homing_speed: 15

# Second pass: accuracy and repeatability
# Optical sensor benefits from a slow re-approach
second_homing_speed: 4

# Retract before second homing pass
# Enough to fully clear the optical sensor
homing_retract_dist: 3
