# =================================================
# Motion mode sounds
# =================================================

[shell_command play_mode_silent]
command: mpg123 /home/hannott/sounds/MotionModeSilent.mp3

[shell_command play_mode_quiet_fast]
command: mpg123 /home/hannott/sounds/MotionModeQuietFast.mp3

[shell_command play_mode_performance]
command: mpg123 /home/hannott/sounds/MotionModePerformance.mp3

[shell_command play_mode_push]
command: mpg123 /home/hannott/sounds/MotionModePush.mp3

[shell_command play_mode_locked]
command: mpg123 /home/hannott/sounds/MotionModeLocked.mp3


# =================================================
# Print lifecycle sounds
# =================================================

[shell_command play_print_paused]
command: mpg123 /home/hannott/sounds/PrintPaused.mp3

[shell_command play_print_resumed]
command: mpg123 /home/hannott/sounds/PrintResumed.mp3

[shell_command play_print_cancelled]
command: mpg123 /home/hannott/sounds/PrintCancelled.mp3

[shell_command play_print_complete]
command: mpg123 /home/hannott/sounds/PrintComplete.mp3

[shell_command play_cooldown_complete]
command: mpg123 /home/hannott/sounds/CooldownComplete.mp3


# =================================================
# Homing / safety / idle
# =================================================

[shell_command play_homing]
command: mpg123 /home/hannott/sounds/Homing.mp3

[shell_command play_idle_timeout]
command: mpg123 /home/hannott/sounds/IdleTimeout.mp3
