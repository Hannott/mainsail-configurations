# =================================================
# XY JOG MACROS
#
# Safe, relative XY-only jogging
# - No Z motion
# - Relative moves only
# - Respects current motion limits
# - Suitable for UI buttons and console use
# =================================================


[gcode_macro _XY_JOG_PARAMS]
description: Internal XY jog parameters
variable_step_mm: 10.0
variable_feedrate: 6000
gcode:
  # parameter holder only


[gcode_macro _XY_JOG]
description: Internal helper for XY jogging
gcode:
  {% set dx = params.DX|default(0)|float %}
  {% set dy = params.DY|default(0)|float %}

  {% if dx == 0 and dy == 0 %}
    RESPOND TYPE=error MSG="XY_JOG called with no movement"
    RETURN
  {% endif %}

  G91
  G1 X{dx} Y{dy} F{printer["gcode_macro _XY_JOG_PARAMS"].feedrate}
  G90


[gcode_macro JOG_X_PLUS]
description: Jog X positive
gcode:
  _XY_JOG DX={printer["gcode_macro _XY_JOG_PARAMS"].step_mm} DY=0


[gcode_macro JOG_X_MINUS]
description: Jog X negative
gcode:
  _XY_JOG DX={-printer["gcode_macro _XY_JOG_PARAMS"].step_mm} DY=0


[gcode_macro JOG_Y_PLUS]
description: Jog Y positive
gcode:
  _XY_JOG DX=0 DY={printer["gcode_macro _XY_JOG_PARAMS"].step_mm}


[gcode_macro JOG_Y_MINUS]
description: Jog Y negative
gcode:
  _XY_JOG DX=0 DY={-printer["gcode_macro _XY_JOG_PARAMS"].step_mm}
